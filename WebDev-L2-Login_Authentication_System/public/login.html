<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskHub - Login to your secure task management account.">
  <title>Welcome Back - TaskHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><rect width='24' height='24' rx='6'/><path d='M6 12l4 4 8-8' stroke='white' stroke-width='2.5' fill='none'/></svg>">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Left Column: Login Form -->
      <div class="auth-form-column">
        <div>
          <!-- Top Navigation Header -->
          <div class="auth-header-nav">
            <a href="/" class="brand-logo" id="logoLink">
              <div class="brand-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </div>
              <span class="brand-name">TaskHub</span>
            </a>
            <div class="switch-auth-link">
              Don't have an account? <a href="/register" id="toRegisterLink">Register</a>
            </div>
          </div>

          <!-- Title Section -->
          <div class="auth-title-section">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Login to access your account.</p>
          </div>

          <!-- Alert Notification Box -->
          <div id="alertBox" class="alert-box" role="alert" aria-live="polite">
            <svg id="alertIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="alertMessage"></span>
          </div>

          <!-- Login Form -->
          <form id="loginForm" class="auth-form" novalidate>
            <!-- Identifier (Username or Email) -->
            <div class="form-group">
              <div class="input-wrapper">
                <span class="input-icon-left">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                  </svg>
                </span>
                <input
                  type="text"
                  id="identifier"
                  name="identifier"
                  class="form-input"
                  placeholder="Enter username or email"
                  autocomplete="username"
                  required
                >
              </div>
            </div>

            <!-- Password -->
            <div class="form-group">
              <div class="input-wrapper">
                <span class="input-icon-left">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </span>
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="form-input"
                  placeholder="Enter password"
                  autocomplete="current-password"
                  required
                >
                <button type="button" class="toggle-password-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
                  <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Remember me & Forgot Password -->
            <div class="form-options-row">
              <label class="checkbox-label" for="rememberMe">
                <input type="checkbox" id="rememberMe" class="checkbox-input">
                <span>Remember me</span>
              </label>
              <a href="javascript:void(0)" id="forgotPasswordLink" class="forgot-link">Forgot password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="loginSubmitBtn" class="btn-primary">
              <span id="btnText">Login</span>
            </button>
          </form>

          <!-- Divider -->
          <div class="auth-divider">
            <span>or</span>
          </div>

          <!-- Social Button -->
          <button type="button" class="btn-google" id="googleLoginBtn">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Continue with Google</span>
          </button>
        </div>
      </div>

      <!-- Right Column: Visual Hero Banner -->
      <div class="auth-banner-column auth-banner-mountain">
        <div class="banner-content">
          <h2 class="banner-heading">Organize<br>Your Work,<br>Achieve More.”</h2>
          <p class="banner-subtext">Simple. Secure. Productive.</p>
          <div class="banner-accent-line"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
