<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskHub - Create your secure account to access your personal dashboard.">
  <title>Create an Account - TaskHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><rect width='24' height='24' rx='6'/><path d='M6 12l4 4 8-8' stroke='white' stroke-width='2.5' fill='none'/></svg>">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Left Column: Registration Form -->
      <div class="auth-form-column">
        <div>
          <!-- Top Navigation Header -->
          <div class="auth-header-nav">
            <a href="/" class="brand-logo" id="logoLink">
              <div class="brand-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </div>
              <span class="brand-name">TaskHub</span>
            </a>
            <div class="switch-auth-link">
              Already have an account? <a href="/login" id="toLoginLink">Login</a>
            </div>
          </div>

          <!-- Title Section -->
          <div class="auth-title-section">
            <h1 class="auth-title">Create an Account</h1>
            <p class="auth-subtitle">Register to access your dashboard.</p>
          </div>

          <!-- Alert Notification Box -->
          <div id="alertBox" class="alert-box" role="alert" aria-live="polite">
            <svg id="alertIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="alertMessage"></span>
          </div>

          <!-- Registration Form -->
          <form id="registerForm" class="auth-form" novalidate>
            <!-- Username -->
            <div class="form-group">
              <div class="input-wrapper">
                <span class="input-icon-left">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </span>
                <input
                  type="text"
                  id="username"
                  name="username"
                  class="form-input"
                  placeholder="Enter username"
                  autocomplete="username"
                  required
                >
              </div>
            </div>

            <!-- Email -->
            <div class="form-group">
              <div class="input-wrapper">
                <span class="input-icon-left">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                  </svg>
                </span>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="form-input"
                  placeholder="Enter email"
                  autocomplete="email"
                  required
                >
              </div>
            </div>

            <!-- Password -->
            <div class="form-group">
              <div class="input-wrapper">
                <span class="input-icon-left">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </span>
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="form-input"
                  placeholder="Enter password"
                  autocomplete="new-password"
                  required
                >
                <button type="button" class="toggle-password-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
                  <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Live Password Requirements Checklist -->
            <div class="password-requirements" id="passwordRequirements">
              <div class="requirement-item" id="reqLength">
                <span class="requirement-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"></circle>
                  </svg>
                </span>
                <span>At least 8 characters</span>
              </div>
              <div class="requirement-item" id="reqNumber">
                <span class="requirement-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"></circle>
                  </svg>
                </span>
                <span>At least 1 number</span>
              </div>
              <div class="requirement-item" id="reqCombo">
                <span class="requirement-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"></circle>
                  </svg>
                </span>
                <span>Use letters and numbers</span>
              </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="registerSubmitBtn" class="btn-primary" style="margin-top: 8px;">
              <span id="btnText">Register</span>
            </button>
          </form>
        </div>
      </div>

      <!-- Right Column: Visual Hero Banner -->
      <div class="auth-banner-column auth-banner-workspace">
        <div class="banner-content">
          <h2 class="banner-heading">Join TaskHub<br>today</h2>
          <p class="banner-subtext">Create your account and get started in seconds.</p>
          <div class="banner-accent-line"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
